<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amigurumi Component Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen py-10 px-4">
    <div class="max-w-4xl mx-auto bg-white shadow-lg rounded-2xl p-8">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-slate-900">Amigurumi Component Generator</h1>
            <p class="text-slate-600 mt-2">Generate precise row-by-row crochet patterns, dimensions, and yarn estimates.</p>
        </header>

        <!-- Shape Selector Tabs -->
        <div class="flex flex-wrap justify-center gap-2 mb-8 border-b pb-4">
            <button onclick="switchShape('sphere')" id="tab-sphere" class="shape-tab px-4 py-2 font-semibold rounded-lg bg-indigo-600 text-white transition">Sphere</button>
            <button onclick="switchShape('cylinder')" id="tab-cylinder" class="shape-tab px-4 py-2 font-semibold rounded-lg bg-slate-200 text-slate-700 hover:bg-slate-300 transition">Cylinder</button>
            <button onclick="switchShape('cone')" id="tab-cone" class="shape-tab px-4 py-2 font-semibold rounded-lg bg-slate-200 text-slate-700 hover:bg-slate-300 transition">Cone</button>
            <button onclick="switchShape('oval')" id="tab-oval" class="shape-tab px-4 py-2 font-semibold rounded-lg bg-slate-200 text-slate-700 hover:bg-slate-300 transition">Oval</button>
        </div>

        <!-- Generator Form -->
        <form id="pattern-form" onsubmit="generatePattern(event)" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Common Fields -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Yarn Weight</label>
                    <select id="yarn_weight" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500">
                        <option value="fingering">Fingering</option>
                        <option value="sport">Sport</option>
                        <option value="dk" selected>DK</option>
                        <option value="worsted">Worsted</option>
                        <option value="bulky">Bulky</option>
                        <option value="super_bulky">Super Bulky</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Hook Size (mm)</label>
                    <input type="number" step="0.25" id="hook_size_mm" value="3.0" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>

            <!-- Dynamic Shape-Specific Inputs -->
            <div id="dynamic-inputs" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Injected via JavaScript depending on selected shape -->
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow transition">
                Generate Pattern
            </button>
        </form>

        <!-- Results Display Area -->
        <div id="results-container" class="mt-10 hidden">
            <h2 class="text-2xl font-bold text-slate-900 mb-4">Generated Pattern & Metrics</h2>

            <!-- Metrics Summary Cards -->
            <div id="metrics-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                <!-- Metric cards populated by JS -->
            </div>

            <!-- General Stuffing Tip Banner -->
            <div class="bg-indigo-50 border-l-4 border-indigo-600 p-4 rounded-xl mb-6 text-indigo-900 text-sm">
                <h4 class="font-bold mb-1">💡 Stuffing Tip:</h4>
                <p>Start stuffing 2–3 rows into the decrease, adding more gradually as you shape before closing off.</p>
            </div>

            <!-- Row-by-Row Instructions -->
            <div class="bg-slate-900 text-slate-100 rounded-xl p-6 overflow-x-auto shadow-inner">
                <h3 class="text-lg font-semibold mb-4 text-indigo-300 border-b border-slate-800 pb-2">Instructions</h3>
                <ul id="instructions-list" class="space-y-2 font-mono text-sm">
                    <!-- Instructions populated by JS -->
                </ul>
            </div>
        </div>
    </div>

    <script>
        let currentShape = 'sphere';

        function switchShape(shape) {
            currentShape = shape;
            document.querySelectorAll('.shape-tab').forEach(tab => {
                tab.classList.remove('bg-indigo-600', 'text-white');
                tab.classList.add('bg-slate-200', 'text-slate-700');
            });
            document.getElementById(`tab-${shape}`).classList.remove('bg-slate-200', 'text-slate-700'); document.getElementById(`tab-${shape}`).classList.add('bg-indigo-600', 'text-white');
            renderDynamicInputs();
        }

        function renderDynamicInputs() {
            const container = document.getElementById('dynamic-inputs');
            if (currentShape === 'sphere') {
                container.innerHTML = `
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Target Diameter (inches)</label>
                        <input type="number" step="0.5" id="target_size" value="3.0" class="w-full border border-slate-300 rounded-lg p-2.5">
                    </div>
                `;
            } else if (currentShape === 'cylinder') {
                container.innerHTML = `
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Target Diameter (inches)</label>
                        <input type="number" step="0.5" id="target_diameter" value="3.0" class="w-full border border-slate-300 rounded-lg p-2.5">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Target Height (inches)</label>
                        <input type="number" step="0.5" id="target_height" value="4.0" class="w-full border border-slate-300 rounded-lg p-2.5">
                    </div>
                `;
            } else if (currentShape === 'cone') {
                container.innerHTML = `
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Base Diameter (inches)</label>
                        <input type="number" step="0.5" id="base_diameter" value="3.0" class="w-full border border-slate-300 rounded-lg p-2.5">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Height (inches)</label>
                        <input type="number" step="0.5" id="height" value="4.0" class="w-full border border-slate-300 rounded-lg p-2.5">
                    </div>
                `;
            } else if (currentShape === 'oval') {
                container.innerHTML = `
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Target Length (inches)</label>
                        <input type="number" step="0.5" id="max_length_inches" value="5.0" class="w-full border border-slate-300 rounded-lg p-2.5">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Target Width (inches)</label>
                        <input type="number" step="0
